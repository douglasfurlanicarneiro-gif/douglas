name: Qualidade e segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · testes e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Auditar vulnerabilidades conhecidas
        run: python -m pip_audit -r requirements.txt
      - name: Executar testes
        run: python -m pytest -q

  frontend:
    name: Aplicativo · tipos, padrão visual e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências exatas
        run: npm ci
      - name: Validar Expo
        run: npx expo-doctor
      - name: Validar código e tipografia
        run: npm run lint
      - name: Validar tipos
        run: npx tsc --noEmit
      - name: Rejeitar vulnerabilidades críticas
        run: npm audit --audit-level=critical
      - name: Gerar vitrine web
        env:
          EXPO_PUBLIC_BACKEND_URL: https://lessence-furlani-api.onrender.com
        run: npm run build:web
      - name: Instalar navegador de testes
        run: npx playwright install --with-deps chromium
      - name: Testar vitrine, carrinho, frete e checkout
        run: npm run test:e2e
