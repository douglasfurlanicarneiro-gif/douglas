name: Manter API ativa

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  acessar-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Acessar API no Render
        run: |
          HTTP_STATUS=$(curl \
            --location \
            --silent \
            --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            -A "GitHub-Actions-Keep-Alive" \
            -o /dev/null \
            -w "%{http_code}" \
            "https://lessence-furlani-api.onrender.com/")

          echo "Resposta da API: HTTP $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "000" ]; then
            echo "Não foi possível acessar a API."
            exit 1
          fi
