name: Manter vitrine ativa

on:
  schedule:
    # Executa a cada 10 minutos
    - cron: "7,17,27,37,47,57 * * * *"

  # Permite testar manualmente
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acessar-vitrine:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Acessar site no Render
        run: |
          curl --location \
            --fail \
            --silent \
            --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            -A "GitHub-Actions-Keep-Alive" \
            "https://lessence-furlani-vitrine.onrender.com/" \
            > /dev/null
