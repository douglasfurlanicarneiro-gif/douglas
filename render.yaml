services:
  - type: web
    name: lessence-furlani-vitrine
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:web
    staticPublishPath: dist
    autoDeployTrigger: commit

    envVars:
      - key: EXPO_PUBLIC_BACKEND_URL
        value: https://lessence-furlani-api.onrender.com

    routes:
      # Encaminha todas as chamadas da vitrine para a API oficial.
      - type: rewrite
        source: /api
        destination: https://lessence-furlani-api.onrender.com/api

      - type: rewrite
        source: /api/*
        destination: https://lessence-furlani-api.onrender.com/api/*

      # Mantém a navegação interna do site funcionando.
      # Esta regra precisa ficar por último.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Arquivos gerados pelo Expo podem ficar em cache por bastante tempo.
      - path: /_expo/static/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"

      # O manifesto deve ser atualizado quando houver uma nova versão.
      - path: /manifest.json
        name: Cache-Control
        value: "no-cache"

      # Evita que a página principal fique presa em uma versão antiga.
      - path: /
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"

      - path: /index.html
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"

      # Cabeçalhos básicos de segurança.
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"

      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"

      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"

      - path: /*
        name: X-Frame-Options
        value: "DENY"

      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"

      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-67fhrP0+BkBqmgGGXTtgiVO/9EQs3QruYNU/7fnRkI8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://lessence-furlani-api.onrender.com https://cdn.jsdelivr.net; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests"

      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin-allow-popups"

      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: "none"
